<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Heritage</title>
  <link rel="stylesheet" href="home.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <script src="home.js" defer></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
        const filterBtn = document.getElementById('filterBtn');
        const filterMenu = document.getElementById('filterMenu');
        
        filterBtn.addEventListener('click', function() {
            filterMenu.classList.toggle('show');
        });

        // Close filter menu when clicking outside
        document.addEventListener('click', function(event) {
            if (!filterBtn.contains(event.target) && !filterMenu.contains(event.target)) {
                filterMenu.classList.remove('show');
            }
        });
    });

    document.addEventListener('DOMContentLoaded', async () => {
        try {
            const response = await fetch('http://localhost:8000/api/locations/');
            if (!response.ok) throw new Error('Failed to fetch locations');
            
            const locations = await response.json();
            const gallery = document.getElementById('locationGallery');
            
            locations.forEach(location => {
                const locationElement = document.createElement('div');
                locationElement.className = 'location-item';
                locationElement.innerHTML = `
                    <img src="${location.image_path}" alt="${location.title}">
                    <div class="location-info">
                        <h3>${location.title}</h3>
                        <p>${location.city}</p>
                        <span class="category">${location.category}</span>
                    </div>
                `;
                gallery.appendChild(locationElement);
            });
        } catch (error) {
            console.error('Error loading locations:', error);
        }
    });

    // Add filter functionality
    document.getElementById('applyFilter').addEventListener('click', async () => {
        const selectedCategories = Array.from(document.querySelectorAll('input[name="category"]:checked'))
            .map(input => input.value)
            .join(',');
        
        try {
            const response = await fetch(`http://localhost:8000/api/locations/?category=${selectedCategories}`);
            if (!response.ok) throw new Error('Failed to fetch filtered locations');
            
            const locations = await response.json();
            const gallery = document.getElementById('locationGallery');
            gallery.innerHTML = ''; // Clear existing locations
            
            locations.forEach(location => {
                const locationElement = document.createElement('div');
                locationElement.className = 'location-item';
                locationElement.innerHTML = `
                    <img src="${location.image_path}" alt="${location.title}">
                    <div class="location-info">
                        <h3>${location.title}</h3>
                        <p>${location.city}</p>
                        <span class="category">${location.category}</span>
                    </div>
                `;
                gallery.appendChild(locationElement);
            });
        } catch (error) {
            console.error('Error filtering locations:', error);
        }
    });
  </script>
  <style>
    .location-item {
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        margin-bottom: 20px;
    }

    .location-item img {
        width: 100%;
        height: 200px;
        object-fit: cover;
    }

    .location-info {
        padding: 15px;
        background: white;
    }

    .location-info h3 {
        margin: 0;
        color: #333;
    }

    .location-info p {
        margin: 5px 0;
        color: #666;
    }

    .category {
        display: inline-block;
        padding: 3px 8px;
        background: #f0f0f0;
        border-radius: 4px;
        font-size: 12px;
        color: #555;
    }
  </style>
</head>
<body>
  <!-- Entête identique à celle de la page Map -->
  <header class="header-heritage">
    <h1><span class="emoji"></span> Heritage</h1>
    <button id="filterBtn" class="filter-button">Filtrer</button>
  </header>
  <div class="hero-image">
    <img src="background home.webp" alt="HERITAGE" />
  </div>
  
  <!-- Conteneur du menu -->
  <div class="menu-container">
    <button class="menu-button">
      <div></div>
      <div></div>
      <div></div>
    </button>

    <div class="menu">
      <div id="authSection">
        <a href="connexion.html" id="loginLink">Sign in</a>
        <a href="#" id="logoutBtn" style="display: none;">Logout</a>
      </div>
      <a href="#">Settings</a>
      <a href="#">About</a>
    </div>
    
  </div>

  <!-- Bouton Filtrer + Menu -->
  
  <div id="filterMenu" class="filter-menu hidden">
    <label>
        <input type="checkbox" name="category" value="Destination" />
        <i class="fas fa-map-marked-alt"></i>
        Destination
    </label>
    <label>
        <input type="checkbox" name="category" value="Souvenirs" />
        <i class="fas fa-gift"></i>
        Souvenirs
    </label>
    <label>
        <input type="checkbox" name="category" value="Hotel" />
        <i class="fas fa-hotel"></i>
        Hotel
    </label>
    <label>
        <input type="checkbox" name="category" value="Guide" />
        <i class="fas fa-book-open"></i>
        Guide
    </label>
    <label>
        <input type="checkbox" name="category" value="Transport" />
        <i class="fas fa-bus"></i>
        Transport
    </label>
    <button id="applyFilter" class="apply-filter">
        <i class="fas fa-check"></i>
        Appliquer
    </button>
  </div>

  <!-- Galerie -->
<div class="content">
  <div class="gallery" id="locationGallery">
    <!-- Locations will be loaded dynamically -->
  </div>
</div>

  <!-- Pied de page -->
  <nav class="footer">
    <a href="home.html" class="footer-button">
        <i class="fas fa-home"></i>
        <span>Home</span>
    </a>
    <a href="map.html" class="footer-button">
        <i class="fas fa-map-marker-alt"></i>
        <span>Map</span>
    </a>
    <a href="profile.html" class="footer-button">
        <i class="fas fa-user"></i>
        <span>Profil</span>
    </a>
  </nav>

</body>
</html>
